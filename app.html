<script>
let MODE = "parent";
try { MODE = localStorage.getItem("sansu-step-mode") === "child" ? "child" : "parent"; } catch (e) {}
document.body.classList.toggle("child", MODE === "child");
function setMode(m) { try { localStorage.setItem("sansu-step-mode", m); } catch (e) {} location.reload(); }
/* ---------- 問題データ（回ごと。出典: 予習シリーズ5年下。データは data_0N.js / keys_0N.js / figs_0N.js） ---------- */
const KAI_LIST = Object.keys(window.KAI_DATA || {}).map(Number).sort((a, b) => a - b);
let KAI_NO = 4;
try { const h = /^#kai(\d+)$/.exec(location.hash); const ls = +localStorage.getItem("sansu-step-kai"); KAI_NO = h ? +h[1] : (ls || 4); } catch (e) {}
if (!KAI_LIST.includes(KAI_NO)) KAI_NO = KAI_LIST.includes(4) ? 4 : KAI_LIST[0];
const KD = window.KAI_DATA[KAI_NO];

// 同じ人が同じ日に付け直したときは、新しい1回ではなく「その日の結果の直し」として最後の記録を置きかえる
// （×→◎→×と押し直すと3回解いたことになっていた。2026-10-08 ユーザー「その日であれば1回でいいです」）。前後は log に残る
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
async function saveSub(p, i, entry) {
  if (window.rei2Active && window.rei2Active(p)) return window.setRei2(KAI_NO, p.id, i, !!entry.ok);   // 2回目の例題は別に記録（today.js）
  const key = sk(p, i), prev = rec[key] || [], l = prev[prev.length - 1];
  const fix = l && l.by === entry.by && sameDay(entry.t, l.t);
  const arr = fix ? prev.slice(0, -1).concat([Object.assign({}, entry, {t: l.t})]) : prev.concat([entry]);
  if (window.logRecChange) logRecChange(KAI_NO, key, rec[key] || null, arr, fix ? "つけ直す（同じ日）" : "つける");
  rec[key] = arr;
  try { localStorage.setItem(LS, JSON.stringify(rec)); } catch (e) {}
  if (db) { try { await db.doc(RECC + "/" + key).set({tries: arr}); } catch (e) { flash("記録をアプリに保存できませんでした。この端末には残っています。"); } }
}
// 小問の◎×を手で切り替える: まだ → ◎ → × → まだ（塾でやった問題や、◎付けのまちがいを直すとき）
async function cycleSub(p, i) {
  const l = last(p, i);
  if (!l || !sameDay(l.t, Date.now())) return saveSub(p, i, {ok: true, t: Date.now(), by: "hand"});
  if (l.ok) return fixLast(p, i, false);
  // 今日の記録だけを消す（前の日の記録は残す）
  const key = sk(p, i), rest = (rec[key] || []).slice(0, -1); if (window.logRecChange) logRecChange(KAI_NO, key, rec[key] || null, rest.length ? rest : null, "まだにもどす（今日の分）");
  if (rest.length) rec[key] = rest; else delete rec[key];
  try { localStorage.setItem(LS, JSON.stringify(rec)); } catch (e) {}
  if (db) { try { if (rest.length) await db.doc(RECC + "/" + key).set({tries: rest}); else await db.doc(RECC + "/" + key).delete(); } catch (e) {} }
}
const markOf = (p, i) => last(p, i) ? (subOk(p, i) ? "◎" : "×") : "・";
let editMarks = false;
async function fixLast(p, i, ok) {
  if (window.rei2Active && window.rei2Active(p)) return window.setRei2(KAI_NO, p.id, i, !!ok);
  const key = sk(p, i); const arr = (rec[key] || []).slice();
  if (!arr.length || !sameDay(arr[arr.length - 1].t, Date.now())) return saveSub(p, i, {ok, t: Date.now(), by: "hand"});
  arr[arr.length - 1] = Object.assign({}, arr[arr.length - 1], {ok, by: "hand"});
  if (window.logRecChange) logRecChange(KAI_NO, key, rec[key] || null, arr, "付け直す");
  rec[key] = arr;
  try { localStorage.setItem(LS, JSON.stringify(rec)); } catch (e) {}
  if (db) { try { await db.doc(RECC + "/" + key).set({tries: arr}); } catch (e) {} }
}

// 1) 土台の単元が全部◎になった練習問題があれば、それを先に出す（単元の途中でも）
// 2) なければ、例題1の単元から順に、まだ◎でない最初の問題（例題→類題→基本問題）
// ×の問題は◎になるまで同じものが出る
function pickNext() {
  for (const r of PRACTICE) if (!itemOk(r) && ready(r))
    return {p: r, why: r.after && ITEMS[r.after] ? ITEMS[r.after].no + "ができたので、反復問題" : r.needs.map(id => unitById(id).label).join("と") + "の系統ができたので、練習問題に挑戦"};
  for (const u of UNITS) for (const p of unitItems(u)) if (!itemOk(p)) {
    const k = kind(p);
    const why = itemTried(p) ? "前に×だったので、もう一度" :
      p === u.steps[0] ? "新しい系統のはじまり" : kind(p) === "反復基本" ? "1回でできなかった問題があったので、反復問題でもう一度" : u.steps[u.steps.indexOf(p) - 1].no + "ができたので、次の問題";
    return {p, why};
  }
  return null;
}

// 段がどの小問の説明か（viz の steps[].sub、または説明文の頭の "(1)" など）
const stepSub = (st, subs) => { if (st && st.sub) return st.sub; const t = String((st && (st.text || st.t)) || "").trim(); return subs.find(s => s && t.startsWith(s)) || ""; };
// まだ◎になっていない最初の小問の段から始める（全部まだ／全部◎なら最初から）
function startStep(p, target, steps) {
  if (!steps || !steps.length || target.id !== p.id || p.subs.length < 2) return 0;
  const undone = p.subs.map((_, i) => i).filter(i => !subOk(p, i));
  if (!undone.length || undone.length === p.subs.length) return 0;
  const want = p.subs[undone[0]], j = steps.findIndex(st => stepSub(st, p.subs) === want);
  return j < 0 ? 0 : j;
}
function subJumps(p, steps, cur, attr) {
  const seen = []; steps.forEach((st, j) => { const sb = stepSub(st, p.subs); if (sb && !seen.some(x => x.sb === sb)) seen.push({sb, j}); });
  if (seen.length < 2) return "";
  return `<div class="row sjump">${seen.map(x => `<button class="ghost mini${x.j <= cur && !seen.some(y => y.j > x.j && y.j <= cur) ? " on" : ""}" ${attr}="${x.j}">${esc(x.sb)}から</button>`).join("")}</div>`;
}

  if (lectItem) { const L = LI[lectItem.id], imgs = Array.isArray(L) ? L : L.imgs, from = Array.isArray(L) ? "" : L.src === "基礎" ? "算数基礎の授業" : "算数の授業";
    h += `<details class="ansimg"><summary>授業の板書を見る${lectItem.id === p.id ? "" : "（" + esc(lectItem.no) + "）"}<span class="note">　${from ? from + "・" : ""}答えが見えます</span></summary>${imgs.map(src => `<img src="${src}" alt="${esc(lectItem.no)}の授業の板書">`).join("")}</details>`; }
  const figs = FIGS[exTarget.id];
  if (figs && figStep < 0) figStep = startStep(p, exTarget, figs);
  if (figs) { const f = figs[Math.min(figStep, figs.length - 1)];
    h += subJumps(p, figs, figStep, "data-fj");
    h += `<div class="fig"><p class="ft">図で見る${exTarget.id === p.id ? "" : "（" + esc(exTarget.no) + "）"}　${figStep + 1}/${figs.length}</p><p>${esc(f.t)}</p><div class="fs">${f.svg}</div>
      <div class="fn"><button class="ghost" id="fprev" ${figStep ? "" : "disabled"}>◀ まえ</button><span class="dots">${figs.map((_, j) => `<i class="${j === figStep ? "on" : ""}"></i>`).join("")}</span><button class="${figStep < figs.length - 1 ? "primary" : "ghost"}" id="fnext" ${figStep < figs.length - 1 ? "" : "disabled"}>つぎ ▶</button></div></div>`;
  }
  if (sample && canExplain) {
    const canViz = true;   // 画像を送れない画面では、本の解き方から図を組み立てる
    if (canViz) h += `<div class="row"><button class="${viz ? "ghost" : "primary"}" id="vz" ${busy || vizBusyFor ? "disabled" : ""}>${vizBusyFor ? "図をかいています…" : viz ? "図で説明をかき直す" : "図で説明してもらう"}</button></div>`;
    if (vizMsg) h += `<p class="note">${esc(vizMsg)}</p>`;
    if (viz && viz.steps && viz.steps.length) { const st = viz.steps[Math.min(vizStep, viz.steps.length - 1)];
      h += subJumps(exTarget, viz.steps, vizStep, "data-vj");
      h += `<div class="fig"><p class="ft">図で説明　${vizStep + 1}/${viz.steps.length}</p><p>${esc(st.text)}</p><div class="fs">${vizDraw(exTarget, viz, vizStep)}</div>
        <div class="fn"><button class="ghost" id="vprev" ${vizStep ? "" : "disabled"}>◀ まえ</button><span class="dots">${viz.steps.map((_, j) => `<i class="${j === vizStep ? "on" : ""}"></i>`).join("")}</span><button class="${vizStep < viz.steps.length - 1 ? "primary" : "ghost"}" id="vnext" ${vizStep < viz.steps.length - 1 ? "" : "disabled"}>つぎ ▶</button></div>
        ${viz.kind === "overlay" ? "" : `<p class="note">図は説明のために描き直したものです。長さの比は本の図と同じではありません。</p>`}</div>`; }
    h += `<div class="row"><button id="ex" ${busy ? "disabled" : ""}>${key ? "解説してもらう" : esc(exTarget.no) + "の解き方を教えてもらう"}</button>${busy ? `<button class="ghost" id="stop">とめる</button>` : ""}</div>`;
    h += `<div class="chat" id="chat">${chat.map((c, j) => j === 0 ? "" : `<div class="${c.role === "user" ? "me" : "cl"}">${esc(c.show || c.content)}</div>`).join("")}</div>`;
    if (chat.length > 1) h += `<form class="ask" id="askf"><input id="askq" placeholder="わからないところを聞く" autocomplete="off"><button ${busy ? "disabled" : ""}>聞く</button></form>`;
  } else h += `<p class="note">${sample ? "この問題の解説は、解答編が入ったら使えます。" : "この画面では Claude を呼べません。"}</p>`;
  h += `</section>`;
  // 次へ
  if (MODE === "child") h += `<div class="row"><button class="primary" id="next">つぎの問題へ</button><button class="ghost" id="back">一覧にもどる</button></div></div>`;
  else h += `<div class="row">${itemOk(p) ? `<button class="primary" id="next">次の問題へ</button>` : `<span class="note">◎になるまで、解説を見てもう一度やろう。</span><button class="ghost" id="next">ほかの問題を先にやる</button>`}</div></div>`;
  // 再生中（開いている）の解説動画は描き直さない: ◎×を押すと描き直すので、前の動画の要素をそのまま戻す（同じタスクの中で戻せば止まらない）
  const oldVid = el.querySelector("details.vid[open]");
  el.innerHTML = h;
  if (oldVid) { const nv = el.querySelector("details.vid"); if (nv && nv.dataset.vk === oldVid.dataset.vk) nv.replaceWith(oldVid); }
  if (pendingFlash) { flash(pendingFlash); pendingFlash = ""; }

  if (photo && $("#phimg")) $("#phimg").src = URL.createObjectURL(photo);
  const ph = $("#ph"); if (ph) ph.onchange = () => { photo = ph.files[0] || null; marks = null; render(); };
  const sa = $("#showans"); if (sa) sa.onclick = () => { showAns = !showAns; renderCur(); if (showAns && !viz) explainViz(p, exTarget); };
  el.querySelectorAll("[data-ta]").forEach(x => x.oninput = () => { typed[+x.dataset.ta] = x.value; });
  const tf = $("#typef"); if (tf) tf.onsubmit = e => { e.preventDefault(); checkTyped(p, subsToDo.length ? subsToDo : p.subs.map((_, i) => i)); };
  const g = $("#grade"); if (g) g.onclick = () => grade(p, subsToDo.length ? subsToDo : p.subs.map((_, i) => i));
  el.querySelectorAll("[data-hand]").forEach(b => b.onclick = async () => { const i = +b.dataset.hand, ok = b.dataset.ok === "1";
    if (MODE === "child") await saveSub(p, i, {ok, t: Date.now(), by: "kid"}); else await fixLast(p, i, ok); render(); });
  const fp = $("#fprev"), fx = $("#fnext");
  if (fp) fp.onclick = () => { figStep--; renderCur(); };
  if (fx) fx.onclick = () => { figStep++; renderCur(); };
  const ex = $("#ex"); if (ex) ex.onclick = () => explain(p, exTarget);
  const hv = $("#heavy"); if (hv) hv.onclick = () => { hv.disabled = true; hv.textContent = "よみこみ中…"; loadHeavy().then(renderCur); };
  const vz = $("#vz"); if (vz) vz.onclick = () => explainViz(p, exTarget, !!viz);
  el.querySelectorAll("[data-vj]").forEach(b => b.onclick = () => { vizStep = +b.dataset.vj; renderCur(); });
  el.querySelectorAll("[data-fj]").forEach(b => b.onclick = () => { figStep = +b.dataset.fj; renderCur(); });
  const vp = $("#vprev"), vn = $("#vnext");
  if (vp) vp.onclick = () => { vizStep--; renderCur(); };
  if (vn) vn.onclick = () => { vizStep++; renderCur(); };
  const st = $("#stop"); if (st) st.onclick = () => ctl && ctl.abort();
  const f = $("#askf"); if (f) f.onsubmit = e => { e.preventDefault(); const q = $("#askq").value.trim(); if (q) ask(q); };
  if (MODE === "child") { $("#next").onclick = () => kidNext(p); $("#back").onclick = () => { curId = null; resetWork(); render(); window.scrollTo(0, 0); }; }
  else $("#next").onclick = () => { if (itemOk(p)) goNext(); else skipOnce(p); };
}
// 「ほかの問題を先に」: いまの問題をとばして、その次の候補へ（記録は変えない）
function skipOnce(p) {
  const order = [...PRACTICE.filter(ready), ...UNITS.flatMap(unitItems)].filter(q => !itemOk(q) && q.id !== p.id);
  if (order.length) { curId = order[0].id; curWhy = "あとで" + p.no + "にもどろう"; } resetWork(); render();
}
function render() { renderTally(); renderMap(); renderCur(); }

/* ---------- Claude に頼む ---------- */
function answerLines(p, key, idx) { return idx.map(i => `${p.subs[i] || "答え"}: ${key.a[i]}`).join("\n"); }
async function grade(p, idx) {
  const key = KEYS[p.id]; busy = true; render(); $("#gst").textContent = "丸付け中…";
  const prompt = `あなたは小学5年生の算数の丸付けをする先生です。写真は、子どもが次の問題を紙に解いた答案です。

【問題】
${key.q || "（問題文は、いっしょに送る1枚目の画像。2枚目が子どもの答案）"}

【本の正しい答え】
${answerLines(p, key, idx)}

【やること】
写真から、上の小問それぞれについて子どもが最後に書いた答えを読み取り、本の正しい答えと同じかどうかを判定してください。
- 正しい答えは「本の正しい答え」だけです。自分で解き直して判定を変えてはいけません。
- 比は順番も同じでなければ×。約分していない比は◎にして、comment で「かんたんにしよう」と伝える。
- 単位を書き忘れただけなら◎にして、comment で単位を書くよう伝える。
- 答えが複数ある問題は、全部そろっていて余分がないときだけ◎。
- 写真で読み取れない小問は read を null、correct を null にする。当て推量で判定しない。

次のJSONだけを返してください:
{"subs":[{"sub":"(1)","read":"子どもの答え","correct":true}],"comment":"子どもへの一言。やさしく1〜2文"}`;
  try {
    const qimg = key.q ? [] : await imgBlob(p.img);
    const r = await sample.json(prompt, {images: [...qimg, photo]});
    const got = Array.isArray(r && r.subs) ? r.subs : [];
    marks = {subs: idx.map((i, j) => {
      const m = got.find(x => x && x.sub === (p.subs[i] || "答え")) || got[j] || {};
      return {i, read: m.read ?? null, correct: m.correct === true ? true : m.correct === false ? false : null};
    }), comment: typeof r.comment === "string" ? r.comment : ""};
    for (const m of marks.subs) if (m.correct !== null) await saveSub(p, m.i, {ok: m.correct, t: Date.now(), by: "claude", read: m.read});
  } catch (e) {
    marks = null; flashLater(e.code === "not_granted" ? "Claude を使う許可がないので、自分で付けてね。" : e.code === "rate_limited" ? "少し待ってから、もう一度押してね。" : e.code === "image_rejected" ? "この写真は送れませんでした。別の写真にしてね。" : "丸付けできませんでした。もう一度押すか、自分で付けてね。");
  }
  busy = false; render();
}
let pendingFlash = ""; function flashLater(t) { pendingFlash = t; }

// 打ちこんだ答えの答え合わせ: 書き方をそろえて同じなら◎。ちがうときは Claude に（文字だけで）同じ答えかを聞く。Claude が使えなければ本の答えを見せる
const norm = t => String(t || "").normalize("NFKC").replace(/\([^)]*[ぁ-んァ-ヶ一-龥][^)]*\)/g, "").replace(/[\s、，,]/g, "").replace(/：/g, ":").toLowerCase();
async function checkTyped(p, idx) {
  const key = KEYS[p.id];
  const rows = idx.map(i => ({i, kid: (typed[i] || "").trim(), ans: key.a[i]}));
  if (rows.some(r => !r.kid)) { flashLater("答えを全部打ちこんでね。"); return render(); }
  let res = rows.map(r => ({i: r.i, read: r.kid, correct: norm(r.kid) === norm(r.ans) ? true : null}));
  const unsure = res.filter(r => r.correct === null);
  if (unsure.length && sample) {
    busy = true; render();
    try {
      const j = await sample.json(`小学5年生の算数の丸付けです。子どもの答えが本の正しい答えと同じ答えかを判定してください。自分で問題を解き直してはいけません。
- 単位がないだけ、書き方（漢字・ひらがな・全角半角・分数と帯分数）がちがうだけなら正解。
- 比は順番も同じでなければ不正解。約分していない比は正解。答えが複数あるものは、全部そろっていて余分がないときだけ正解。
${unsure.map(r => `${p.subs[r.i] || "答え"}: 本の答え「${key.a[r.i]}」／子どもの答え「${r.read}」`).join("\n")}
次のJSONだけを返してください: {"results":[{"sub":"(1)","correct":true}]}`, {modelTier: "quick"});
      const got = Array.isArray(j && j.results) ? j.results : [];
      unsure.forEach((r, k) => { const m = got.find(x => x && x.sub === (p.subs[r.i] || "答え")) || got[k]; if (m && typeof m.correct === "boolean") r.correct = m.correct; });
    } catch (e) {}
    busy = false;
  }
  for (const r of res) if (r.correct !== null) await saveSub(p, r.i, {ok: r.correct, t: Date.now(), by: "typed", read: r.read});
  marks = {subs: res, comment: res.some(r => r.correct === null) ? "「？」は判定できなかったので、本の答え（解説の欄）と見くらべて、下の◎か×を押してね。" : ""};
  render();
}

function explainRules(p, target) {
  const k = KEYS[target.id];
  const kid = marks ? marks.subs.map(m => `${p.subs[m.i] || "答え"}: 子どもの答え「${m.read ?? "読めない"}」→ ${m.correct ? "正解" : m.correct === false ? "まちがい" : "不明"}`).join("\n") : "（まだ丸付けしていない）";
  return `あなたは小学5年生に算数を教える、やさしい先生です。予習シリーズ5年下の問題の解説をします。

【問題】${target.id === p.id ? "" : `（いま解いているのは ${p.no}。その土台になっている ${target.no} の解き方を説明する）`}
${k.q || "（問題文は、いっしょに送る1枚目の画像）"}

【本の答え】
${k.a.map((a, i) => `${target.subs[i] || "答え"}: ${a}`).join("\n")}

【本の解き方】
${k.how || "（本に解説がない。本の答えになる解き方を、この単元の考え方で説明する）"}

【画面に出ている図（この順に子どもがめくって見る）】
${(FIGS[target.id] || []).map((f, i) => `図${i + 1}: ${f.t}`).join("\n") || "（図なし）"}

【この子の結果】
${target.id === p.id ? kid : "（" + p.no + "を解いている途中）"}
${lectBlock(target)}

【きまり】
- 本の解き方の考え方にそって説明する。本の答えとちがう答えを言ってはいけない。
- まちがえた小問があれば、そこから先に説明する。写真があれば、どこでまちがえたかを見て伝える。
- 小学5年生にわかる言葉で、式は1行ずつ書く。全体で400字くらいまで。
- マークダウンの記号（# * - など）は使わない。見出しは【 】で書く。
- 図があるときは、図と同じ順に説明し、「図2を見てね」のように図の番号を入れる。
- 最後に「もう一度やってみよう」と声をかける。`;
}
async function run(turns, opts) {
  busy = true; ctl = new AbortController(); render();
  const box = document.createElement("div"); box.className = "cl"; box.textContent = "考え中…"; $("#chat").append(box);
  try {
    const {text} = await sample(turns, Object.assign({cache: false, signal: ctl.signal, onText: ({text}) => { box.textContent = text; }}, opts || {}));
    chat.push({role: "assistant", content: text});
  } catch (e) {
    if (e.text) chat.push({role: "assistant", content: e.text});
    else if (e.code !== "cancelled") chat.push({role: "assistant", content: e.code === "rate_limited" ? "いま混んでいます。少し待ってからもう一度押してね。" : "説明できませんでした。もう一度押してね。", show: null});
    if (chat.length && chat[chat.length - 1].role === "user") chat.pop();
  }
  busy = false; ctl = null; render();
}
async function imgBlob(src) { try { const r = await fetch(await imgReady(src)); return [await r.blob()]; } catch (e) { return []; } }
// 図で説明: 作ったものは保存（この端末＋アプリ）。「答えを見る」で裏で作り始める
let vizBusyFor = null;
const vizKey = t => KAI_NO + "_" + t.id;
async function vizCached(t) {
  try { const v = JSON.parse(localStorage.getItem("sansu-viz-" + vizKey(t)) || "null"); if (vizUsable(t, v)) return v; } catch (e) {}
  if (db) { try { const d = await db.doc("viz/" + vizKey(t)).get(); if (d.exists && d.data().json) { const v = JSON.parse(d.data().json); if (vizUsable(t, v)) { try { localStorage.setItem("sansu-viz-" + vizKey(t), d.data().json); } catch (e) {} return v; } } } catch (e) {} }
  return null;
}
async function explainViz(p, target, fresh) {
  if (!sample || vizBusyFor === target.id) return;
  const id = curId;
  if (!fresh) { const c = await vizCached(target); if (c) { if (curId === id) { viz = c; vizStep = startStep(p, target, c.steps); vizMsg = ""; render(); } return; } }
  vizBusyFor = target.id; if (curId === id) { vizMsg = "図をかいています…（30秒〜1分くらい）"; render(); }
  const kid = target.id === p.id && marks ? marks.subs.map(m => `${p.subs[m.i] || "答え"}: 「${m.read ?? "?"}」→ ${m.correct ? "正解" : m.correct === false ? "まちがい" : "不明"}`).join("\n") : "";
  let d = null, msg = "";
  try {
    const imgs = canImg ? await imgBlob(target.img) : [];
    d = await sample.json(vizPromptFor(target, KEYS[target.id], kid, imgs.length > 0), imgs.length && !target.fig ? {images: imgs} : {});
    if (!d || !Array.isArray(d.steps) || !d.steps.length) throw {code: "invalid_json"};
    if (lectOf(target)) d.lect = true;
    if (target.fig && target.fig.vizVer) d.vizVer = target.fig.vizVer;   // ★図の点を直したら古い図を使わない（2026-10-12）
    const js = JSON.stringify(d);
    try { localStorage.setItem("sansu-viz-" + vizKey(target), js); } catch (e) {}
    if (db) { try { await db.doc("viz/" + vizKey(target)).set({json: js, t: Date.now()}); } catch (e) {} }
  } catch (e) {
    d = null; msg = e.code === "rate_limited" ? "いま混んでいます。少し待ってからもう一度押してね。" : "図をかけませんでした。もう一度押してね。";
  }
  vizBusyFor = null;
  if (curId === id) { if (d) { viz = d; vizStep = startStep(p, target, d.steps); } vizMsg = msg; render(); }
}
async function explain(p, target) {
  chat = [{role: "user", content: explainRules(p, target) + "\n\nでは、説明を始めてください。"}];
  const imgs = canImg ? [...(KEYS[target.id].q ? [] : await imgBlob(target.img)), ...(photo && target.id === p.id ? [photo] : [])] : [];
  run(chat, imgs.length ? {images: imgs} : {});
}
function ask(q) {
  chat.push({role: "user", content: q});
  const turns = chat.slice(0, 1).concat(chat.slice(1).slice(-10));
  run(turns);
}

$("#kai").innerHTML = KAI_LIST.map(n => `<option value="${n}" ${n === KAI_NO ? "selected" : ""}>${esc(window.KAI_DATA[n].title)}</option>`).join("");
$("#kai").onchange = e => switchKai(+e.target.value);
window.addEventListener("hashchange", () => { const h = /^#kai(\d+)$/.exec(location.hash); if (h && +h[1] !== KAI_NO) location.reload(); });
if (MODE === "parent") goNext(); else render();
$("#tochild").onclick = () => setMode("child");

$("#toparent").onclick = () => { $("#pwbox").hidden = false; $("#pw").focus(); };
$("#pwf").onsubmit = e => { e.preventDefault(); if ($("#pw").value.trim().toLowerCase() === PARENT_PW) setMode("parent"); else { $("#pwmsg").textContent = "ちがいます"; $("#pw").value = ""; } };
(async () => {
  if (!window.claude) return;
  try {
    db = await claude.use("db");
    let first = true;
    if (db) db.collection(RECC).onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && Array.isArray(v.tries)) next[d.id] = v.tries; });
      if (snap.empty && Object.keys(rec).length) { first = false; return; }   // アプリにまだ記録が無いときは、この端末の記録を使う
      rec = next; try { localStorage.setItem(LS, JSON.stringify(rec)); } catch (e) {}
      if (first) { first = false; if (!busy && !marks && MODE === "parent") goNext(); else if (!busy) render(); } else if (!busy) render();
    }, () => {});
  } catch (e) {}
  try {
    sample = await claude.use("sample");
    if (sample) { const lim = await sample.limits().catch(() => null); canImg = !!(lim && lim.images); }

  } catch (e) { sample = null; }

})();
